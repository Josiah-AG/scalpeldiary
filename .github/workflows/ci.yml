name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scalpeldiary_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: scalpeldiary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://scalpeldiary_test:local-ci-only@127.0.0.1:5432/scalpeldiary_test
      TEST_DATABASE_URL: postgresql://scalpeldiary_test:local-ci-only@127.0.0.1:5432/scalpeldiary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server && npm ci --prefix client
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f server/tests/fixtures/baseline-schema.sql
      - run: npm run build:server && npm run db:upgrade --prefix server
      - run: npm test --prefix server
      - run: npm test --prefix client && npm run build:client
      - run: npm audit --prefix server --audit-level=high && npm audit --prefix client --audit-level=high
      - run: diff -q shared/types.ts server/src/shared/types.ts && diff -q shared/procedureUtils.ts server/src/shared/procedureUtils.ts && diff -q shared/procedureRequirements.json server/src/shared/procedureRequirements.json
